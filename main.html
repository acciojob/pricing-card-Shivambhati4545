<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Main Card Container -->
    <div class="card">
      <!-- Image element -->
      <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7" alt="Pricing Card Image" />
      
      <!-- Title: H1 tag -->
      <h1>Pricing Card</h1>
      
      <!-- Pricing Information: Paragraph tag -->
      <p class="price">Price: Rs.200</p>
      
      <!-- Description: Paragraph tag -->
      <p class="description">
        Description: Lorem ipsum dolor sit amet, consectetur adipiscing elit.
      </p>
      
      <!-- Buy Now Button -->
      <button class="buy-btn">Buy Now</button>
    </div>
  </body>
</html>
